spring:
  datasource:
    url: jdbc:h2:mem:gateway;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  cloud:
    gateway:
      mvc:
        routes: []
