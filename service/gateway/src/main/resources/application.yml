server:
  port: 8080

spring:
  application:
    name: gateway
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:mysql://localhost:3306/medilabo_gateway?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true
    username: medilabo
    password: medilabo
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré par db/schema.sql
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  cloud:
    gateway:
      mvc:
        routes:
          - id: patient-service
            uri: http://localhost:8081
            predicates:
              - Path=/patient/**
          - id: notes-service
            uri: http://localhost:8082
            predicates:
              - Path=/notes/**
          - id: risk-assessment-service
            uri: http://localhost:8083
            predicates:
              - Path=/risk/**

logging:
  pattern:
    # %cthread{15} = thread centré (converter custom CenteredThreadConverter)
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr(${LOGGED_APPLICATION_NAME:-}){faint}%clr([%cthread{15}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  level:
    root: INFO
    com.medilabo.gateway.logging: INFO
    org.springframework.security: WARN
    org.springframework.jdbc.datasource.init: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
