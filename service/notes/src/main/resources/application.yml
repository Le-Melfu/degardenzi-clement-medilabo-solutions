server:
  port: 8082

spring:
  application:
    name: notes
  output:
    ansi:
      enabled: ALWAYS
  data:
    mongodb:
      # Compte de service applicatif (jamais root)
      uri: mongodb://medilabo:medilabo@localhost:27017/medilabo_notes?authSource=medilabo_notes&serverSelectionTimeoutMS=5000

logging:
  pattern:
    # %cthread{15} = centred thread name (custom CenteredThreadConverter)
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr(${LOGGED_APPLICATION_NAME:-}){faint}%clr([%cthread{15}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  level:
    root: INFO
    com.medilabo.notes.logging: INFO
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN
